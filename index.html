<!doctype html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Endorphind — Creative AI & Wellness Studio</title>

      name="description"
      content="Endorphind is a pioneering creative and wellness company at the intersection of art, storytelling, AI, and technology. We build AI applications, intelligent digital experiences, and wellness products."

      content="Endorphind, AI, artificial intelligence, creative studio, wellness, web development, FindAura, mental health, diffusion models, RAG, automation"

    <link rel="canonical" href="https://endorphind.com/" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://endorphind.com/" />
    <meta
      property="og:title"
      content="Endorphind — Creative AI & Wellness Studio"
    />
    <meta
      property="og:description"
      content="A pioneering creative and wellness company building AI applications and intelligent digital experiences at the intersection of art, storytelling, and technology."
    />
    <meta property="og:image" content="https://endorphind.com/asset.jpg" />
    <meta property="og:site_name" content="Endorphind" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

      name="twitter:title"
      content="Endorphind — Creative AI & Wellness Studio"
    />

      name="twitter:description"
      content="A pioneering creative and wellness company building AI applications and intelligent digital experiences at the intersection of art, storytelling, and technology."

    <!-- Base JSON-LD: Organization + WebSite -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://endorphind.com/#organization",
            "name": "Endorphind",
            "url": "https://endorphind.com",
            "logo": {
              "@type": "ImageObject",
              "url": "https://endorphind.com/asset.jpg"
            },
            "description": "A pioneering creative and wellness company at the intersection of art, storytelling, AI, and technology. We build AI applications and intelligent digital experiences.",
            "sameAs": []
          },
          {
            "@type": "WebSite",
            "@id": "https://endorphind.com/#website",
            "url": "https://endorphind.com",
            "name": "Endorphind",
            "publisher": {
              "@id": "https://endorphind.com/#organization"
            }
          }
        ]
      }
